<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #f6f3e9; }
  body {
    position: fixed; inset: 0; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas.stage { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; }
  .chrome { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  .chrome > * { position: absolute; pointer-events: auto; }
  .mono {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(26, 22, 20, 0.6); text-shadow: 0 0 6px #f6f3e9, 0 0 14px #f6f3e9;
  }
  .back-link { top: max(24px, env(safe-area-inset-top)); left: clamp(16px, 4vw, 40px); transition: color .3s; }
  .back-link:hover, .fallback a:hover { color: #1a1614; }
  .fallback { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; }
  .no-data .fallback { display: grid; }
  /* Thumbnail on the Brown Ensemble page: picture only */
  .embed .chrome { display: none; }
</style>
<script>
  if (location.hash === '#still') document.documentElement.classList.add('embed');
