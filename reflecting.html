<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reflecting — Aumara Realms — Eamon Brown</title>
<meta name="description" content="Reflecting, a realm from Aumara Realms by Eamon Brown — overlapping coloured layers you can cut through, live in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Jost:wght@100;200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; }
  body {
    position: fixed; inset: 0; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas.realm { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  /* Controls: back link, sound, ink sets */
  .chrome { position: fixed; inset: 0; z-index: 5; pointer-events: none; isolation: isolate; }
  .chrome > * { position: absolute; pointer-events: auto; }
  .chrome, .chrome * { text-shadow: 0 0 6px #000, 0 0 14px #000, 0 0 22px rgba(0,0,0,.8); }
  .mono {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: rgba(232, 228, 222, 0.72);
  }
  .back-link { top: max(24px, env(safe-area-inset-top)); left: clamp(16px, 4vw, 40px); transition: color .3s; }
  .back-link:hover { color: var(--bone); }

  .sound {
    top: max(18px, calc(env(safe-area-inset-top) - 6px)); right: clamp(10px, 4vw, 34px);
    display: flex; align-items: center; gap: 10px; padding: 6px;
    background: none; border: 0; cursor: pointer;
  }
  .sound i { /* three bars: still when off, breathing when on */
    display: inline-flex; gap: 3px; align-items: center; height: 14px;
  }
  .sound i b { width: 2px; height: 3px; background: currentColor; border-radius: 1px; transition: height .4s; }
  .sound[data-state="on"] i b { animation: bar 1.6s ease-in-out infinite; }
  .sound[data-state="on"] i b:nth-child(2) { animation-delay: -.5s; }
  .sound[data-state="on"] i b:nth-child(3) { animation-delay: -1s; }
  .sound[data-state="starting"] i b { animation: bar .5s ease-in-out infinite; }
  @keyframes bar { 0%, 100% { height: 3px; } 50% { height: 13px; } }
  .sound > span { display: none; }
  .sound[data-state="off"] .off, .sound[data-state="on"] .on,
  .sound[data-state="starting"] .starting, .sound[data-state="blocked"] .blocked { display: inline; }
  .sound:hover { color: var(--bone); }

  .gels { right: clamp(16px, 4vw, 40px); bottom: max(26px, env(safe-area-inset-bottom)); display: grid; justify-items: end; gap: 12px; }
  .gel-row { display: flex; gap: 9px; }
  .gel-row button {
    width: 16px; height: 16px; padding: 0; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(232, 228, 222, 0.28); background: var(--sw);
    box-shadow: 0 0 10px rgba(0,0,0,.8);
    transition: transform .3s, border-color .3s;
  }
  .gel-row button:hover { transform: scale(1.18); }
  .gel-row button[aria-pressed="true"] { border-color: var(--bone); transform: scale(1.18); outline: 1px solid rgba(232,228,222,.35); outline-offset: 3px; }

  .fallback { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; }
  .no-gl .fallback { display: grid; }
  .no-gl canvas.realm, .no-gl .gels, .no-gl .sound { display: none; }
  .fallback img { max-height: 70vh; width: auto; border-radius: 22px; border: 1px solid var(--line); margin: 0 auto 20px; }

  /* Embedded on the Aumara Realms page: picture only */
  .embed .chrome { display: none; }
  .embed canvas.realm { cursor: default; }

  @media (max-width: 640px) {
    .gels { left: clamp(16px, 4vw, 40px); right: auto; justify-items: start; }
    .gel-row { gap: 11px; }
    .gel-row button { width: 18px; height: 18px; }
  }
</style>
<script>
  // Sound (AudioWorklet) only works on a secure page — send http:// visitors to https://
  if (location.protocol === 'http:' && location.hostname.endsWith('eamonbrown.com')) location.replace('https:' + location.href.slice(5));
  if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');
</script>
</head>
<body>
<canvas class="realm" aria-label="Reflecting — overlapping coloured layers. Drag to cut through them; keep still and they settle."></canvas>

<div class="chrome">
  <a class="back-link mono" href="aumara-realms.html">← Aumara Realms</a>

  <button class="sound mono" type="button" aria-pressed="false" aria-label="Sound" data-state="off">
    <i aria-hidden="true"><b></b><b></b><b></b></i>
    <span class="off">Sound off</span><span class="starting">Starting…</span><span class="on">Sound on</span><span class="blocked">Sound blocked · tap to retry</span>
  </button>

  <div class="gels" role="group" aria-label="Ink set">
    <div class="gel-row">
      <button data-gel="0" aria-label="Riso Classic" title="Riso Classic" style="--sw: conic-gradient(#ff268c 0 33%, #1a73ff 0 66%, #ffe60d 0)"></button>
      <button data-gel="1" aria-label="Ink Wash"     title="Ink Wash"     style="--sw: conic-gradient(#f5f5f0 0 33%, #8c8f94 0 66%, #292b30 0)"></button>
      <button data-gel="2" aria-label="Huichol"      title="Huichol"      style="--sw: conic-gradient(#fa1a99 0 33%, #1ae6bf 0 66%, #ff730d 0)"></button>
      <button data-gel="3" aria-label="Primary"      title="Primary"      style="--sw: conic-gradient(#ff2938 0 33%, #ffe614 0 66%, #2961ff 0)"></button>
      <button data-gel="4" aria-label="Oxide"        title="Oxide"        style="--sw: conic-gradient(#33d99e 0 33%, #e0611a 0 66%, #942185 0)"></button>
      <button data-gel="5" aria-label="Midnight"     title="Midnight"     style="--sw: conic-gradient(#1775de 0 33%, #7514b0 0 66%, #fa8017 0)"></button>
      <button data-gel="6" aria-label="Duotone"      title="Duotone"      style="--sw: conic-gradient(#ff4d47 0 33%, #149e99 0 66%, #b8babf 0)"></button>
    </div>
  </div>
</div>

<div class="fallback">
  <div>
    <img src="aumara-1.jpg" alt="Reflecting, on iPhone">
    <p class="mono">This realm needs WebGL 2 — try a recent browser.<br><a href="aumara-realms.html">← Aumara Realms</a></p>
  </div>
</div>

<script src="reflecting.js?v=4"></script>
</body>
</html>
